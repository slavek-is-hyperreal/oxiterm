[package]
name = "oxiterm-core"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Must NOT depend on tokio, prometheus, russh, ureq, hyper, notify or oxiterm-server
# (enforced by tests/core_boundary.rs).
[dependencies]
oxiterm-proto = { path = "../oxiterm-proto" }
# text-shaping: layout measures proportional text by shaping (Phase 6.3), so the server and the
# local/WASM core measure identically.
oxiterm-renderer = { path = "../oxiterm-renderer", default-features = false, features = ["text-shaping"] }
oxiterm-a11y = { path = "../oxiterm-a11y" }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
