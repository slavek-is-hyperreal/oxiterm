[package]
name = "oxiscript-cli"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "`oxi`: the OxiScript command-line tool (check, fmt, explain, new, run, build)."

[[bin]]
name = "oxi"
path = "src/main.rs"

[dependencies]
oxiscript-syntax = { path = "../oxiscript-syntax" }
oxiscript-check = { path = "../oxiscript-check" }
oxiscript-abi = { path = "../oxiscript-abi" }
oxiscript-lower = { path = "../oxiscript-lower" }
# the shared compile-and-run path (same runtime and limits as the browser playground)
oxiscript-playground = { path = "../oxiscript-playground" }
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
