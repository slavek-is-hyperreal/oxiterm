[package]
name = "oxiscript-rc"
version = "0.0.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OxiScript memory runtime: reference counting with a cycle collector (Phase 8)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["float-fmt"]
# `oxi_str_from_f64` (shortest round-trip printing via core::fmt, ~25 KB of wasm).
# Without it the export still exists but traps `Unreachable`; for size experiments only.
float-fmt = []

[dependencies]
# Guest allocator (MIT OR Apache-2.0). Used by the wasm32 build (memory.grow backed)
# and, with an arena back end, by the native test heap.
dlmalloc = "0.2.14"

[dev-dependencies]
oxiscript-abi = { path = "../oxiscript-abi" }
wasmi = { version = "2.0.3", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
