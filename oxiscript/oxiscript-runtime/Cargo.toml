[package]
name = "oxiscript-runtime"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OxiScript execution runtime: wasmi host, capabilities, fuel, hot reload (Phase 8)."

[features]
default = ["std"]
# Forwarded to wasmi. This crate itself still uses `std` (oxiscript-abi does);
# the flag exists so a `--no-default-features` check shows what wasmi needs.
std = ["wasmi/std"]

[dependencies]
oxiscript-abi = { path = "../oxiscript-abi" }
# `validate` = wasmparser validation (never run without it); `deterministic` =
# canonical NaNs from float operations; default `wat` is not wanted.
# `simd` and `memory64` are compiled in ON PURPOSE (BAD ACTOR F1): only then do the
# `wasm_simd`/`wasm_relaxed_simd`/`wasm_memory64` setters exist, so `Host::with_options` can
# switch them OFF explicitly. Otherwise a sibling crate enabling them through Cargo feature
# unification would silently turn them on for the host. They are never enabled at run time.
wasmi = { version = "2.0.3", default-features = false, features = ["validate", "deterministic", "stable", "auto-dispatch", "simd", "memory64"] }

# Export-section scan (re-exports of imports); the same version wasmi pulls in.
wasmparser = { version = "0.228", default-features = false, features = ["std", "validate", "features", "simd"] }

[dev-dependencies]
# Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT; tests only.
wat = "1"
# Bytecode Alliance, Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT; tests only.
wasm-smith = "0.263"
# MIT OR Apache-2.0; tests only.
arbitrary = "1.4"
