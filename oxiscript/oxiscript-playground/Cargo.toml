[package]
name = "oxiscript-playground"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OxiScript compiler in the browser (wasm-bindgen): check, format, later compile+run. Used by oxiscript.slavekm.pl."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxiscript-syntax = { path = "../oxiscript-syntax" }
oxiscript-check = { path = "../oxiscript-check" }
oxiscript-abi = { path = "../oxiscript-abi" }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
