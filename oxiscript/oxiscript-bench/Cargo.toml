[package]
name = "oxiscript-bench"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OxiPerf: the OxiScript performance benchmark harness (`oxiperf`): fuel, wall time, memory, size, compile latency, cross-language."
publish = false

[[bin]]
name = "oxiperf"
path = "src/main.rs"

[features]
default = []
# Wasmtime (Cranelift) executor, opt-in (`--features wasmtime`): it adds a ~6 min Cranelift build to any workspace build;
# the harness then reports the Wasmtime rows as unavailable.
wasmtime = ["dep:wasmtime"]

[dependencies]
oxiscript-lower = { path = "../oxiscript-lower" }
oxiscript-runtime = { path = "../oxiscript-runtime" }
serde_json = "1.0"
# Apache-2.0 WITH LLVM-exception (OR Apache-2.0 OR MIT). Interpreter-free JIT/AOT executor for the .wasm files.
wasmtime = { version = "51.0.0", optional = true, default-features = false, features = ["std", "runtime", "cranelift"] }
