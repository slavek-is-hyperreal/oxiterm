[package]
name = "oxiterm-renderer"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
oxiterm-proto = { path = "../oxiterm-proto" }
taffy = { workspace = true }
serde = { workspace = true }
nom = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }
parking_lot = { workspace = true }
base64 = "0.22.1"
image = "0.25"
resvg = { version = "0.50", optional = true }
rlottie = { version = "0.5.4", optional = true }
serde_json = { workspace = true, optional = true }
# Proportional text shaping (Phase 6 spike). `no_std` mode = libm math (same bits on every target)
# and no fontdb system scan / memmap; fonts only ever come from embedded bytes.
cosmic-text = { version = "0.19", default-features = false, features = ["no_std"], optional = true }

[features]
# Native media: Lottie (rlottie C bindings), SVG (resvg), ffmpeg video, the filesystem asset
# fallback and the clock-driven playback. Off = pure build for wasm/Android core: media nodes
# render the same placeholder path the wasm build always used.
default = ["native-media"]
native-media = ["dep:rlottie", "dep:resvg", "dep:serde_json"]
# Phase 6 text shaping (cosmic-text). Not wired into layout or rendering yet.
text-shaping = ["dep:cosmic-text"]
