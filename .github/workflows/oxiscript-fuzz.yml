name: OxiScript fuzz (nightly)

# The long fuzz campaigns are #[ignore]d in normal `cargo test` (too slow for every
# push and for the owner's machine). They run here every night with seeds taken
# from the date, and on demand from the Actions tab. OXI_NIGHTLY_IGNORED=1 adds every
# #[ignore]d heavy test in release (the runner is ~2.5x faster than the owner's machine).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2.9.3
    - name: OxiScript gate (nightly level)
      run: |
        mkdir -p "$RUNNER_TEMP/gate"
        TMPDIR="$RUNNER_TEMP/gate" CARGO_BUILD_JOBS=4 OXI_NIGHTLY_IGNORED=1 scripts/oxiscript-gate.sh nightly
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: oxiscript-gate-logs
        path: ${{ runner.temp }}/gate/gate-*.log
        if-no-files-found: ignore
