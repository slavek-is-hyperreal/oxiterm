name: OxiScript fuzz (nightly)

# The long fuzz campaigns are #[ignore]d in normal `cargo test` (too slow for every
# push and for the owner's machine). They run here every night with seeds taken
# from the date, and on demand from the Actions tab. Heavy tests marked
# `#[cfg_attr(debug_assertions, ignore)]` already run in the release step. OXI_NIGHTLY_IGNORED=1
# (every #[ignore]d test) is NOT used: #[ignore] also marks dump utilities, known-red BAD ACTOR
# findings and tests needing extra targets (run 45842555455 went red on those, 2026-11-26).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2.9.3
    - name: OxiScript gate (nightly level)
      run: |
        mkdir -p "$RUNNER_TEMP/gate"
        TMPDIR="$RUNNER_TEMP/gate" CARGO_BUILD_JOBS=4 scripts/oxiscript-gate.sh nightly
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: oxiscript-gate-logs
        path: ${{ runner.temp }}/gate/gate-*.log
        if-no-files-found: ignore
