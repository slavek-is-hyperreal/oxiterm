name: Sites deploy

# Builds and checks the three static sites and deploys them to Cloudflare Workers (static assets)
# when a release tag is pushed (owner decision: automatic deploys from release 0.0.3 on).
#   oxiscript-v*  -> oxiscript.slavekm.pl + slavekm.pl
#   v*            -> oxiui.slavekm.pl     + slavekm.pl
# The deploy job runs in the GitHub environment "Cloudflare": it holds the secrets
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, allows only release tags and waits for the
# owner's approval. Builds never see the secrets. Manual runs (Actions tab) build and check only,
# unless `deploy` is set; the environment still enforces the tag rule and the approval.
on:
  push:
    tags: [ "oxiscript-v*", "v*" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy (still needs a release tag ref and the owner's approval)"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time (two release tags on one commit both deploy slavekm.pl); never cancel a
# deploy that is already running (BAD ACTOR R2-13).
concurrency:
  group: sites-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Install wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-pack
      uses: taiki-e/install-action@227955246ad60c3108fd48f0559ba9a647315c6e # wasm-pack
    - name: Build and check the sites
      run: sites/build.sh
    - name: Upload the built sites
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sites-dist
        path: sites/dist
        if-no-files-found: error

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: Cloudflare
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false   # nothing needs git later; keep GITHUB_TOKEN out of .git/config (R2-12)
    - name: Download the built sites
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: sites-dist
        path: sites/dist
    - name: Choose the sites for this tag
      id: pick
      run: |
        case "${GITHUB_REF_NAME}" in
          oxiscript-v*) echo "sites=oxiscript home" >> "$GITHUB_OUTPUT" ;;
          v*)           echo "sites=oxiui home"     >> "$GITHUB_OUTPUT" ;;
          *) echo "not a release tag: ${GITHUB_REF_NAME}"; exit 1 ;;
        esac
    # Install the pinned wrangler from the committed lockfile, with no install scripts and no
    # secrets in this step; the step with the token only runs the installed binary (R2-10, R2-11).
    - name: Install wrangler (lockfile, no scripts, no secrets)
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix sites/deploy
    - name: Deploy with wrangler
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        for s in ${{ steps.pick.outputs.sites }}; do
          sites/deploy/node_modules/.bin/wrangler deploy --config "sites/deploy/$s.wrangler.jsonc"
        done
    - name: Check the live sites answer
      run: |
        for s in ${{ steps.pick.outputs.sites }}; do
          case "$s" in home) host=slavekm.pl ;; *) host="$s.slavekm.pl" ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/")
          echo "$host -> $code"; [ "$code" = 200 ]
        done
