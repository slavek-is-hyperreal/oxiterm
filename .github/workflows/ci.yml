name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Security audit also runs weekly, so new advisories surface without a push.
  schedule:
    - cron: "0 6 * * 1"
  # Coverage is heavy and runs only on demand (Actions tab → CI → Run workflow).
  workflow_dispatch:
    inputs:
      coverage:
        description: "Run the coverage job"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2.9.3
    # oxiterm-server embeds the web client bundle with include_bytes!, and the bundle is
    # generated (gitignored), so it must be built before the workspace.
    - name: Install wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack
    - name: Build web client bundle
      run: |
        wasm-pack build --target web --release --out-dir ../oxiterm-server/assets/pkg oxiterm-web -- --no-default-features
        wasm-pack build --target web --release --out-dir ../oxiterm-server/assets/pkg --out-name oxiterm_local oxiterm-web -- --features local
    - name: Build
      run: cargo build --workspace
    - name: Run tests
      run: cargo test --workspace
    - name: Lints
      run: cargo clippy --workspace
    # oxiterm-core must stay portable (browser and Android hosts). Build it alone so Cargo
    # feature unification with the server cannot hide a native/server dependency.
    - name: Core builds for wasm32 and Android
      run: |
        rustup target add aarch64-linux-android
        cargo build -p oxiterm-core --target wasm32-unknown-unknown
        cargo build -p oxiterm-core --target aarch64-linux-android
    # Phase 6.6: the text pipeline must give the same bits on wasm32 (the browser/local core
    # target) as natively. WASI + wasmtime stands in for the browser: shaping determinism table
    # (6.0) plus the whole pipeline (line breaker, .notdef substitution, px to cell, display-list
    # build) against the committed golden. `--dir=.` lets the tests read their (embedded) data.
    - name: Install wasm32-wasip1 target
      run: rustup target add wasm32-wasip1
    - name: Install wasmtime
      uses: taiki-e/install-action@v2
      with:
        tool: wasmtime@51.0.0
    - name: Text pipeline determinism on wasm32 (wasmtime)
      env:
        CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=.
      run: >
        cargo test -p oxiterm-renderer --no-default-features --features text-shaping
        --test text_shaping --test wasm_pipeline --target wasm32-wasip1

  # Stage 5.2: the oxiterm-gpu tests really run here, on Mesa lavapipe (software Vulkan).
  # OXI_GPU_REQUIRED=1 turns "no adapter" from a silent SKIP into a failure, so green means the
  # GPU code ran. No wasm bundle needed: oxiterm-gpu does not depend on oxiterm-server.
  gpu:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WGPU_BACKEND: vulkan
      OXI_GPU_REQUIRED: "1"
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2.9.3
      with:
        shared-key: gpu-release
    - name: Install Mesa software Vulkan driver
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers libvulkan1
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
        if [ -z "$icd" ]; then
          echo "::error::lavapipe ICD json not found under /usr/share/vulkan/icd.d"
          ls -la /usr/share/vulkan/icd.d || true
          exit 1
        fi
        echo "Using ICD: $icd"
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        dpkg -l mesa-vulkan-drivers 'libllvm*' | grep '^ii' || true
    - name: oxiterm-gpu tests (lavapipe, no skipping allowed)
      run: cargo test --release -p oxiterm-gpu -- --test-threads=1 --nocapture
    # The goldens are blessed on one llvmpipe build and skip (loudly) on another. Run them once
    # more with the version gate off so a runner drift shows the actual pixel diff (and the
    # .new.png artifact) without failing the job.
    - name: Goldens on any llvmpipe version (advisory)
      continue-on-error: true
      env:
        OXI_GPU_GOLDEN_ANY_LLVM: "1"
      run: cargo test --release -p oxiterm-gpu --test golden -- --test-threads=1 --nocapture
    - name: Upload rendered images
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: gpu-new-pngs
        path: oxiterm-gpu/tests/golden/*.new.png
        if-no-files-found: ignore

  audit:
    if: github.event_name != 'workflow_dispatch' || !inputs.coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Plain cargo-audit against the committed Cargo.lock: fails on vulnerabilities, reports
    # unmaintained crates as warnings. (rustsec/audit-check needed check-run write access and
    # failed with "Resource not accessible by integration" even with a clean audit.)
    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit
    - name: Run audit
      run: cargo audit

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Install wasm target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack
    - name: Build web client bundle
      run: |
        wasm-pack build --target web --release --out-dir ../oxiterm-server/assets/pkg oxiterm-web -- --no-default-features
        wasm-pack build --target web --release --out-dir ../oxiterm-server/assets/pkg --out-name oxiterm_local oxiterm-web -- --features local
    - name: Install tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin
    - name: Run tarpaulin
      run: cargo tarpaulin --workspace --out xml

  release:
    name: Release
    needs: [build, audit]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack
      - name: Build web client bundle
        run: |
          wasm-pack build --target web --release --out-dir ../oxiterm-server/assets/pkg oxiterm-web -- --no-default-features
          wasm-pack build --target web --release --out-dir ../oxiterm-server/assets/pkg --out-name oxiterm_local oxiterm-web -- --features local
      - name: Build
        run: cargo build --release
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/oxiterm-cli
